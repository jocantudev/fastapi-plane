name: Build and Deploy FastAPI to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  BUILD_ARTIFACT_NAME: fastapi-package
  BUILD_OUTPUT_FILE: fastapi-app.zip
  INFRA_TEMPLATE_PATH: infra/main.bicep
  AZURE_REGION: ${{ vars.AZURE_REGION || 'eastus' }}
  APP_SERVICE_NAME: ${{ vars.APP_SERVICE_NAME }}

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build Application Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create deployable artifact
        run: |
          zip -r "${{ env.BUILD_OUTPUT_FILE }}" . \
            -x "venv/*" "__pycache__/*" "*.pyc" ".git/*" ".github/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: ${{ env.BUILD_OUTPUT_FILE }}

  deploy_infra:
    name: Provision Azure Infrastructure (Bicep)
    runs-on: ubuntu-latest
    needs: build
    outputs:
      appServiceName: ${{ steps.deploy_infra.outputs.appServiceName }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate required deployment variables
        shell: bash
        run: |
          if [ -z "${{ secrets.AZURE_RESOURCE_GROUP }}" ]; then
            echo "Missing secret: AZURE_RESOURCE_GROUP"
            exit 1
          fi
          if [ -z "${{ env.APP_SERVICE_NAME }}" ]; then
            echo "Missing repository variable: APP_SERVICE_NAME"
            exit 1
          fi

      - name: Deploy Bicep template to target resource group
        id: deploy_infra
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP }}
          template: ${{ env.INFRA_TEMPLATE_PATH }}
          parameters: >
            location=${{ env.AZURE_REGION }}
            appServiceName=${{ env.APP_SERVICE_NAME }}

  deploy_app:
    name: Deploy Application to Azure App Service
    runs-on: ubuntu-latest
    needs: deploy_infra
    environment: production
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy artifact to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.deploy_infra.outputs.appServiceName || env.APP_SERVICE_NAME }}
          package: ${{ env.BUILD_OUTPUT_FILE }}
